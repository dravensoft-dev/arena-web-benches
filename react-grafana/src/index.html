<!doctype html>
<html lang="en" class="arena-compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vantage</title>
    <script>
      (function () {
        var DEFAULT = 'dark';
        try {
          var asked = new URLSearchParams(location.search).get('theme');
          if (asked) localStorage.setItem('arena-theme', asked);
          var name = localStorage.getItem('arena-theme');
          if (!name && window.matchMedia('(prefers-color-scheme: light)').matches) name = 'light';
          if (name && name !== DEFAULT && /^[a-z][a-z0-9-]*$/.test(name)) {
            document.documentElement.classList.add('arena-' + name);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./Main.tsx"></script>
  </body>
</html>
