<!doctype html>
<html lang="en">
  <head>
    <base href="./" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maker's Row</title>
    <script>
      (function () {
        var DEFAULT = 'light';
        try {
          var asked = new URLSearchParams(location.search).get('theme');
          if (asked) localStorage.setItem('arena-theme', asked);
          var name = localStorage.getItem('arena-theme');
          if (!name && window.matchMedia('(prefers-color-scheme: dark)').matches) name = 'dark';
          if (name && name !== DEFAULT && /^[a-z][a-z0-9-]*$/.test(name)) {
            document.documentElement.classList.add('arena-' + name);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
